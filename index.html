<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump 25 Trading Bot - Deriv</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div id="sidebar">
        <h2>Deriv Trading Bot</h2>
        
        <div class="input-group">
            <label>Símbolo</label>
            <select id="symbol">
                <option value="R_25" selected>Jump 25 Index</option>
                <option value="R_50">Jump 50 Index</option>
                <option value="R_75">Jump 75 Index</option>
                <option value="R_100">Jump 100 Index</option>
                <option value="R_10">Jump 10 Index</option>
            </select>
        </div>

        <div class="input-group">
            <label>API Token (Opcional) <span style="font-size:9px;color:#666;cursor:pointer;" id="load-token-btn" title="Cargar desde archivo">📁</span></label>
            <input type="password" id="api-token" placeholder="*" value="vUR3ZMe9zElUdpU">
            <input type="file" id="token-file" accept=".txt,.md,.env" style="display:none;">
        </div>

        <div class="input-group">
            <label>App ID</label>
            <input type="text" id="app-id" value="1089" placeholder="Ej: 1089">
        </div>
        <button id="start-btn">CONECTAR</button>

        <div class="input-group">
            <label>Temporalidad</label>
            <div class="timeframe-btns" id="timeframe-btns">
                <button data-value="1">1s</button>
                <button data-value="60" class="active">1m</button>
                <button data-value="300">5m</button>
                <button data-value="900">15m</button>
                <button id="view-1d" title="Ver 1 día">1D</button>
            </div>
            <select id="timeframe" style="display:none;">
                <option value="1">1 Segundo</option>
                <option value="60" selected>1 Minuto</option>
                <option value="300">5 Minutos</option>
                <option value="900">15 Minutos</option>
            </select>
        </div>

        <div class="input-group">
            <label>Estrategia</label>
            <select id="strategy">
                <option value="rsi" selected>RSI (momentum)</option>
                <option value="sma-ema-crossover">SMA/EMA Crossover</option>
                <option value="bollinger-bands">Bollinger Bands</option>
            </select>
        </div>

        <div class="section">
            <label>Indicadores</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="sma-enabled" checked>
                    <label for="sma-enabled">SMA</label>
                    <input type="number" id="sma-period" value="23" min="1">
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="ema-enabled" checked>
                    <label for="ema-enabled">EMA</label>
                    <input type="number" id="ema-period" value="10" min="1">
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="bb-enabled" checked>
                    <label for="bb-enabled">BB</label>
                    <input type="number" id="bb-period" value="20" min="1">
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="rsi-enabled" checked>
                    <label for="rsi-enabled">RSI</label>
                    <input type="number" id="rsi-period" value="7" min="1">
                    <span>per</span>
                    <input type="number" id="rsi-high" value="65" min="0" max="100">
                    <span>high</span>
                    <input type="number" id="rsi-low" value="35" min="0" max="100">
                    <span>low</span>
                </div>
            </div>
        </div>

        <div class="section">
            <label>Configuración</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="auto-scroll" checked>
                    <label for="auto-scroll">Auto-scroll</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="show-tooltip" checked>
                    <label for="show-tooltip">Tooltip</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="sound-alert">
                    <label for="sound-alert">Sonido</label>
                </div>
            </div>
            <div class="input-row" style="margin-top:8px;">
              <div class="checkbox-item">
                    <label>Min velas</label>
                    <input type="number" id="min-candles" value="24" min="10" max="100">
                </div>
            </div>
        </div>

        <div id="logs-container" style="z-index:100;position:relative;">
            <div class="log-entry"><span class="log-time">[--:--:--]</span>Sistema listo. Configure y conecte.</div>
        </div>
    </div>
    <div id="main-content">
        <div id="price-chart">
            <div class="chart-label">JUMP 25 INDEX</div>
            <div class="chart-controls">
                <button id="zoom-out">-</button>
                <button id="zoom-in">+</button>
                <button id="fit-content">⊡</button>
                <button id="toggle-results">📊</button>
            </div>
        </div>
        <div id="rsi-chart">
            <div class="chart-label">RSI</div>
        </div>
        <div id="tooltip">
            <div class="tt-time"></div>
            <div class="tt-row"><span class="tt-label">O</span><span class="tt-open"></span></div>
            <div class="tt-row"><span class="tt-label">H</span><span class="tt-high"></span></div>
            <div class="tt-row"><span class="tt-label">L</span><span class="tt-low"></span></div>
            <div class="tt-row"><span class="tt-label">C</span><span class="tt-close"></span></div>
        </div>
<div id="results-panel" style="display:none;">
            <h4>RESULTADOS <span style="float:right;cursor:pointer;" id="close-results">✕</span></h4>
            <div class="result-stat"><span class="label">Señales HOY</span><span class="value" id="signal-count">0</span></div>
            <div class="result-stat"><span class="label">CALL</span><span class="value call" id="call-count">0</span></div>
            <div class="result-stat"><span class="label">PUT</span><span class="value put" id="put-count">0</span></div>
            <div class="result-stat"><span class="label">Última</span><span class="value" id="last-signal">--</span></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
