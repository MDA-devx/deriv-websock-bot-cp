<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump 25 Trading Bot - Deriv (Fixed)</title>
    <!-- Librería Lightweight Charts - Versión estable -->
    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #131722;
            --sidebar-bg: #1e222d;
            --border-color: #2a2e39;
            --text-color: #d1d4dc;
            --accent-color: #2962ff;
            --success: #089981;
            --danger: #f23645;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 8px;
            box-sizing: border-box;
            z-index: 10;
            overflow-y: auto;
        }

        h2 { font-size: 1.1rem; margin-top: 0; color: #fff; }

        .input-group { margin-bottom: 5px; }
        label { display: block; font-size: 9px; color: #b2b5be; text-transform: uppercase; margin-bottom: 2px; }
         
        input, select {
            width: 100%;
            background-color: #2a2e39;
            border: 1px solid #363c4e;
            color: #d1d4dc;
            padding: 6px;
            border-radius: 3px;
            box-sizing: border-box;
            outline: none;
            font-size: 12px;
        }

        input:focus, select:focus { border-color: var(--accent-color); }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        /* Logs Viewer */
        #logs-container {
            flex-grow: 1;
            margin-top: 10px;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.4; /* Reduced line height for compactness */
            overflow-y: auto;
            color: #4ade80;
            max-height: 250px;
        }

        .log-entry { margin-bottom: 6px; border-bottom: 1px solid #111; padding-bottom: 4px; line-height: 1.4; word-break: break-word; }
        .log-time { color: #888; font-size: 10px; }
        .signal-call { color: var(--success); font-weight: bold; }
        .signal-put { color: var(--danger); font-weight: bold; }

        /* Main Content / Charts */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        #price-chart { flex: 2; position: relative; min-height: 300px; }
        #rsi-chart { flex: 1; border-top: 2px solid var(--border-color); position: relative; min-height: 150px; }

        .chart-label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: rgba(30, 34, 45, 0.8);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Deriv Jump 25 Bot</h2>
        
        <div class="input-group">
            <label for="api-token">API Token (Opcional)</label>
            <input type="password" id="api-token" placeholder="Tu token de Deriv...">
        </div>

        <div class="input-group">
            <label for="app-id">App ID</label>
            <input type="text" id="app-id" value="1089" placeholder="Ej: 1089">
        </div>

        <div class="input-group">
            <label for="timeframe">Temporalidad (Velas)</label>
            <select id="timeframe">
                <option value="1">1 Segundo</option>
                <option value="5">5 Segundos</option>
                <option value="15">15 Segundos</option>
                <option value="60" selected>1 Minuto</option>
                <option value="300">5 Minutos</option>
                <option value="900">15 Minutos</option>
            </select>
        </div>

        <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
            <label style="color: var(--accent-color); font-weight: bold;">Indicadores</label>
            <div style="display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="sma-enabled" checked>
                    <label for="sma-enabled">SMA</label>
                    <input type="number" id="sma-period" value="23" style="width: 60px; margin-left: 5px;">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="ema-enabled" checked>
                    <label for="ema-enabled">EMA</label>
                    <input type="number" id="ema-period" value="10" style="width: 60px; margin-left: 5px;">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="rsi-enabled" checked>
                    <label for="rsi-enabled">RSI</label>
                    <input type="number" id="rsi-period" value="7" style="width: 60px; margin-left: 5px;">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="bb-enabled" checked>
                    <label for="bb-enabled">BB</label>
                    <input type="number" id="bb-period" value="20" style="width: 60px; margin-left: 5px;">
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="rsi-high-enabled" checked>
                    <label for="rsi-high-enabled">RSI High</label>
                    <input type="number" id="rsi-high" value="65" style="width: 60px; margin-left: 5px;">
                </div>
                <div style="display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="rsi-low-enabled" checked>
                    <label for="rsi-low-enabled">RSI Low</label>
                    <input type="number" id="rsi-low" value="35" style="width: 60px; margin-left: 5px;">
                </div>
            </div>
        </div>

        <button id="start-btn">CONECTAR WEBSOCKET</button>

        <div id="logs-container">
            <div class="log-entry">Sistema listo. Ingrese parámetros y conecte.</div>
        </div>
    </div>

    <div id="main-content">
        <div id="price-chart">
            <div class="chart-label">JUMP 25 INDEX</div>
        </div>
        <div id="rsi-chart">
            <div class="chart-label">RSI</div>
        </div>
    </div>

    <script type="module">
        // Import indicator functions
        import { calculateSMA, calculateEMA, calculateRSI, calculateBB } from './frontend/js/modules/indicators.js';
        
        // Chart options configuration
        const chartOptions = {
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true, visible: true },
            handleScale: true,
            handleScroll: true
        };
        
        function initCharts() {
            const pContainer = document.getElementById('price-chart');
            const rContainer = document.getElementById('rsi-chart');
            
            // Limpiar si ya existen para evitar duplicados al reconectar
            pContainer.innerHTML = '<div class="chart-label">JUMP 25 INDEX</div>';
            rContainer.innerHTML = '<div class="chart-label">RSI</div>';

            // Asegurarse de que los contenedores tengan altura
            pContainer.style.minHeight = '300px';
            rContainer.style.minHeight = '150px';

            try {
                priceChart = LightweightCharts.createChart(pContainer, { ...chartOptions, height: pContainer.clientHeight || 300 });
                rsiChart = LightweightCharts.createChart(rContainer, { ...chartOptions, height: rContainer.clientHeight || 150 });
                
                // Verificar que el método existe antes de usarlo
                if (typeof priceChart.addCandlestickSeries === 'function') {
                    candleSeries = priceChart.addCandlestickSeries({
                        upColor: '#089981', downColor: '#f23645',
                        borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645',
                    });
                } else {
                    // Fallback a barras si candlestick no está disponible
                    console.warn('addCandlestickSeries no disponible, usando addBarSeries');
                    candleSeries = priceChart.addBarSeries({
                        upColor: '#089981', downColor: '#f23645',
                        borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645',
                    });
                }
                
                smaSeries = priceChart.addLineSeries({ color: '#2962ff', lineWidth: 2, title: 'SMA' });
                emaSeries = priceChart.addLineSeries({ color: '#f23645', lineWidth: 1, title: 'EMA' });
                bbUpperSeries = priceChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });
                bbLowerSeries = priceChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });

                rsiSeries = rsiChart.addLineSeries({ color: '#ff9800', lineWidth: 2, title: 'RSI' });

                const highLevel = parseFloat(document.getElementById('rsi-high').value) || 65;
                const lowLevel = parseFloat(document.getElementById('rsi-low').value) || 35;
                
                if (!isNaN(highLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: highLevel, 
                        color: '#f23645', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBRECOMPRA' 
                    });
                }
                
                if (!isNaN(lowLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: lowLevel, 
                        color: '#089981', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBREVENTA' 
                    });
                }

                // Sincronización segura de timeScales
                priceChart.timeScale().subscribeVisibleTimeRangeChange(range => {
                    try {
                        if (range && rsiChart) {
                            rsiChart.timeScale().setVisibleRange(range);
                        }
                    } catch (e) {
                        console.warn('Error sincronizando timeScale (precio->rsi):', e);
                    }
                });
                
                rsiChart.timeScale().subscribeVisibleTimeRangeChange(range => {
                    try {
                        if (range && priceChart) {
                            priceChart.timeScale().setVisibleRange(range);
                        }
                    } catch (e) {
                        console.warn('Error sincronizando timeScale (rsi->precio):', e);
                    }
                });
                
                // Ajuste de tamaño al redimensionar ventana
                window.addEventListener('resize', () => {
                    try {
                        if (priceChart && pContainer) {
                            priceChart.resize(pContainer.clientWidth, pContainer.clientHeight || 300);
                        }
                        if (rsiChart && rContainer) {
                            rsiChart.resize(rContainer.clientWidth, rContainer.clientHeight || 150);
                        }
                    } catch (e) {
                        console.warn('Error redimensionando charts:', e);
                    }
                });
            } catch (error) {
                console.error('Error inicializando charts:', error);
                addLog('Error inicializando gráficos: ' + error.message, 'put');
            }
        }

        // --- CÁLCULOS DE INDICADORES (using imported functions) ---

        function updateIndicators() {
            if (dataHistory.length < 2) return;
            
            try {
                const smaP = parseInt(document.getElementById('sma-period').value) || 23;
                const emaP = parseInt(document.getElementById('ema-period').value) || 10;
                const rsiP = parseInt(document.getElementById('rsi-period').value) || 7;
                const bbP = parseInt(document.getElementById('bb-period').value) || 20;

                const smaData = calculateSMA(dataHistory, smaP).filter(d => d.value !== null);
                const emaData = calculateEMA(dataHistory, emaP);
                const rsiData = calculateRSI(dataHistory, rsiP).filter(d => d.value !== null);
                const bb = calculateBB(dataHistory, bbP);

                if (smaSeries) smaSeries.setData(smaData);
                if (emaSeries) emaSeries.setData(emaData);
                if (rsiSeries) rsiSeries.setData(rsiData);
                if (bbUpperSeries) bbUpperSeries.setData(bb.upper.filter(d => d.value !== null));
                if (bbLowerSeries) bbLowerSeries.setData(bb.lower.filter(d => d.value !== null));

                // Paso 5: Señales
                if (rsiData.length >= 2) {
                    const currentRsi = rsiData[rsiData.length - 1].value;
                    const prevRsi = rsiData[rsiData.length - 2].value;
                    if (currentRsi !== null && prevRsi !== null) {
                        processSignals(currentRsi, prevRsi);
                    }
                }
            } catch (error) {
                console.warn('Error actualizando indicadores:', error);
            }
        }

        // --- WEBSOCKET Y CONEXIÓN ---
        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => isConnected ? location.reload() : connect());

        function connect() {
            const appId = document.getElementById('app-id').value || '1089';
            const token = document.getElementById('api-token').value;
            const granularity = parseInt(document.getElementById('timeframe').value) || 60;

            addLog(`Conectando a Deriv (App ID: ${appId})...`);

            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${appId}`);

            ws.onopen = () => {
                addLog('Conectado a Deriv. Solicitando historial (1 hora)...');
                initCharts();
                
                // Hide login elements after successful connection
                document.getElementById('api-token').parentElement.style.display = 'none';
                document.getElementById('app-id').parentElement.style.display = 'none';
                document.getElementById('start-btn').style.display = 'none';
                
                if (token) {
                    ws.send(JSON.stringify({ authorize: token }));
                } else {
                    requestHistory();
                }
            };

            ws.onmessage = (msg) => {
                try {
                    const res = JSON.parse(msg.data);
                    // Debug: Log all incoming messages
                    console.log('WebSocket message received:', res);
                    
                    if (res.msg_type === 'authorize') {
                        if (res.error) {
                            addLog('Error de Token: ' + res.error.message, 'put');
                        } else {
                            addLog('Autorizado.');
                            requestHistory();
                        }
                    }
                    // Handle explicit error messages from API
                    if (res.msg_type === 'error') {
                        addLog('Error de API: ' + (res.error?.message || JSON.stringify(res)), 'put');
                    }

                    // Manejo de Historial de Velas
                    if (res.msg_type === 'candles' && res.candles && Array.isArray(res.candles)) {
                        const validCandles = res.candles
                            .map(c => ({
                                time: parseInt(c.epoch),
                                open: parseFloat(c.open),
                                high: parseFloat(c.high),
                                low: parseFloat(c.low),
                                close: parseFloat(c.close)
                            }))
                            .filter(c => 
                                !isNaN(c.time) && !isNaN(c.open) && !isNaN(c.high) && 
                                !isNaN(c.low) && !isNaN(c.close) &&
                                c.open > 0 && c.high > 0 && c.low > 0 && c.close > 0 &&
                                c.high >= Math.max(c.open, c.close) && 
                                c.low <= Math.min(c.open, c.close)
                            );

                        if (validCandles.length > 0) {
                            dataHistory = validCandles;
                            if (candleSeries) candleSeries.setData(dataHistory);
                            updateIndicators(); // Calcular indicadores iniciales
                            subscribeOHLC();
                            isConnected = true;
                            startBtn.innerText = 'DESCONECTAR';
                            addLog(`Historial cargado: ${dataHistory.length} velas válidas`);
                        } else {
                            addLog('No se recibieron velas válidas del historial', 'put');
                        }
                    }

                    // Manejo de Velas en Tiempo Real (msg_type: ohlc)
                    if (res.msg_type === 'ohlc' && res.ohlc) {
                        const o = res.ohlc;
                        const candle = {
                            time: parseInt(o.open_time),
                            open: parseFloat(o.open),
                            high: parseFloat(o.high),
                            low: parseFloat(o.low),
                            close: parseFloat(o.close)
                        };

                        // Validar que todos los valores sean números válidos
                        if (!isNaN(candle.time) && !isNaN(candle.open) && !isNaN(candle.high) && 
                            !isNaN(candle.low) && !isNaN(candle.close) &&
                            candle.open > 0 && candle.high > 0 && candle.low > 0 && candle.close > 0 &&
                            candle.high >= Math.max(candle.open, candle.close) && 
                            candle.low <= Math.min(candle.open, candle.close)) {
                            
                            if (candleSeries) candleSeries.update(candle);

                            // Actualizar nuestro array de datos
                            if (dataHistory.length > 0 && dataHistory[dataHistory.length - 1].time === candle.time)  {
                                dataHistory[dataHistory.length - 1] = candle; // Actualiza vela actual
                            } else {
                                dataHistory.push(candle);
                                if (dataHistory.length > 5000) dataHistory.shift(); // Limitar memoria
                            }
                            updateIndicators();
                        }
                    }
                } catch (e) {
                    console.error('Error procesando mensaje WS:', e);
                    addLog('Error procesando mensaje: ' + e.message, 'put');
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addLog('Error de WebSocket: ' + error.message, 'put');
            };

            ws.onclose = () => {
                addLog('Conexión cerrada.', 'put');
                isConnected = false;
                startBtn.innerText = 'CONECTAR WEBSOCKET';
            };
        }

        function requestHistory() {
            const gran = parseInt(document.getElementById('timeframe').value) || 60;
            const now = Math.floor(Date.now() / 1000);
            const oneHourAgo = now - 3600; // 1 hora en segundos
            
            // For history request, we DON'T want to subscribe - just get data once
            const request = {
                ticks_history: currentSymbol,
                end: 'latest',
                start: oneHourAgo,
                style: 'candles',
                granularity: gran
                // Note: NOT including subscribe field at all for one-time request
            };
            
            addLog(`Enviando solicitud de historial (no suscripción): ${JSON.stringify(request)}`);
            ws.send(JSON.stringify(request));
        }

        function subscribeOHLC() {
            const gran = parseInt(document.getElementById('timeframe').value) || 60;
            try {
                const subscribeRequest = {
                    ticks_history: currentSymbol,
                    subscribe: 1, // Suscribirse a updates
                    end: 'latest',
                    granularity: gran,
                    style: 'candles'
                };
                addLog(`Enviando solicitud de suscripción: ${JSON.stringify(subscribeRequest)}`);
                ws.send(JSON.stringify({ forget_all: 'ohlc' })); // Olvidar suscripciones previas
                ws.send(JSON.stringify(subscribeRequest));
            } catch (e) {
                console.error('Error suscribiendo a OHLC:', e);
                addLog('Error suscribiendo a actualizaciones: ' + e.message, 'put');
            }
        }

        // --- ESTRATEGIA DE SEÑALES ---
        function processSignals(currentRsi, prevRsi) {
            const rsiHigh = parseFloat(document.getElementById('rsi-high').value) || 65;
            const rsiLow = parseFloat(document.getElementById('rsi-low').value) || 35;
            let signal = null; // 'call' or 'put'
            let trend = '';

            if (currentRsi > rsiHigh && currentRsi > prevRsi) {
                signal = 'call';
                trend = 'Subiendo (RSI > ' + rsiHigh + ')';
            } else if (currentRsi < rsiLow && currentRsi < prevRsi) {
                signal = 'put';
                trend = 'Bajando (RSI < ' + rsiLow + ')';
            }

            const logMsg = `RSI: ${currentRsi.toFixed(2)} | Prev: ${prevRsi.toFixed(2)} | Trend: ${trend}`;
            addLog(logMsg);
            
            // Dibujar marcador en el gráfico
            if (signal && candleSeries && dataHistory && dataHistory.length > 0) {
                const lastCandle = dataHistory[dataHistory.length - 1];
                const markerColor = signal === 'call' ? '#089981' : '#f23645'; // Verde para Call, Rojo para Put
                const markerText = signal === 'call' ? '▲' : '▼';

                candleSeries.createPriceLine({
                    price: lastCandle.high, // Posicionar sobre el máximo de la vela
                    color: markerColor,
                    lineWidth: 2,
                    lineStyle: LightweightCharts.LineStyle.Solid,
                    axisLabelVisible: false, // No mostrar label de precio
                    visible: true,
                    title: markerText // Usar texto como marcador simple
                });
                addLog(`¡SEÑAL DE ${signal.toUpperCase()} DETECTADA!`, signal);
            }
        }

        // Inicialización inicial al cargar la página
        window.onload = () => {
            initCharts();
            // Ajustar tamaño inicial si es necesario
            window.dispatchEvent(new Event('resize'));
        };

        // Función para agregar logs
        function addLog(message, type = 'call') {
            const logsContainer = document.getElementById('logs-container');
            if (!logsContainer) return;
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> ${message}`;
            logsContainer.appendChild(logEntry);
            
            // Mantener solo los últimos 100 logs
            while (logsContainer.children.length > 100) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
            
            // Scroll automático al final
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }
    </script>
</body>
</html>
