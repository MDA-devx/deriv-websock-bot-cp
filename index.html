<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jump 25 Trading Bot - Deriv (Fixed)</title>
    <!-- Librería Lightweight Charts - Versión estable -->
    <script src="https://unpkg.com/lightweight-charts@4.0.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #131722;
            --sidebar-bg: #1e222d;
            --border-color: #2a2e39;
            --text-color: #d1d4dc;
            --accent-color: #2962ff;
            --success: #089981;
            --danger: #f23645;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Responsive for small screens (mobile) like Samsung J2 Prime 720x480 */
        @media (max-width: 600px), (max-height: 500px) {
            html, body {
                height: 100%;
                overflow-y: scroll;
                overflow-x: hidden;
            }
            
            body {
                flex-direction: column;
                height: auto;
            }
            
            #sidebar {
                width: 100%;
                height: auto;
                min-height: 0;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex-shrink: 0;
                padding: 6px;
                overflow-x: hidden;
                overflow-y: auto;
            }
            
            #sidebar h2 {
                font-size: 0.9rem;
                margin: 2px 0;
            }
            
            #sidebar .input-group {
                margin-bottom: 3px;
            }
            
            #sidebar label {
                font-size: 9px;
            }
            
            #sidebar input, #sidebar select {
                padding: 3px;
                font-size: 10px;
                width: 100%;
            }
            
            #sidebar details {
                margin-top: 6px;
                padding-top: 6px;
            }
            
            #sidebar details summary {
                font-size: 10px;
            }
            
            #sidebar details .input-group input {
                padding: 2px;
                font-size: 9px;
            }
            
            #sidebar details label {
                font-size: 8px;
            }
            
            #sidebar button {
                padding: 5px;
                font-size: 10px;
            }
            
            #logs-container {
                max-height: 50px;
                font-size: 9px;
                line-height: 1.3;
                overflow-y: auto;
            }
            
            #main-content {
                flex-direction: column;
                width: 100%;
                height: 100vh;
                flex: 1;
            }
            
            #price-chart {
                width: 100%;
                height: 70%;
                flex: 7;
            }
            
            #rsi-chart {
                width: 100%;
                height: 30%;
                flex: 3;
            }
            
            .chart-label {
                font-size: 9px;
                padding: 2px 4px;
            }
        }

        /* Sidebar Styles */
        #sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
            z-index: 100;
            overflow-y: auto;
        }

        h2 { font-size: 1.1rem; margin-top: 0; color: #fff; }

        .input-group { margin-bottom: 8px; }
        label { display: block; font-size: 10px; color: #b2b5be; text-transform: uppercase; margin-bottom: 4px; }
         
        input, select {
            width: 100%;
            background-color: #2a2e39;
            border: 1px solid #363c4e;
            color: #d1d4dc;
            padding: 8px;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
        }

        input:focus, select:focus { border-color: var(--accent-color); }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            transition: opacity 0.2s;
            z-index: 100;
            position: relative;
        }

        button:hover { opacity: 0.9; }
        button:active { opacity: 0.7; }

        /* Logs Viewer */
        #logs-container {
            flex-grow: 1;
            margin-top: 20px;
            background-color: #000;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.8; /* Increased line height for better readability */
            overflow-y: auto;
            color: #4ade80;
            max-height: 200px;
        }

        .log-entry { margin-bottom: 6px; border-bottom: 1px solid #111; padding-bottom: 4px; line-height: 1.4; word-break: break-word; }
        .log-time { color: #888; font-size: 10px; }
        .signal-call { color: var(--success); font-weight: bold; }
        .signal-put { color: var(--danger); font-weight: bold; }

        /* Main Content / Charts */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        #price-chart { flex: 2; position: relative; min-height: 300px; }
        #rsi-chart { flex: 1; border-top: 2px solid var(--border-color); position: relative; min-height: 150px; }

        .chart-label {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            background: rgba(30, 34, 45, 0.8);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Deriv Jump 25 Bot</h2>
        
        <div class="input-group">
            <label for="api-token">API Token (Opcional)</label>
            <input type="password" id="api-token" placeholder="Tu token de Deriv...">
        </div>

        <div class="input-group">

        <div class="input-group">
            <label for="timeframe">Temporalidad (Velas)</label>

<details style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
    <summary style="color: var(--accent-color); font-weight: bold; cursor: pointer; outline: none;">Indicadores</summary>
    <div style="display: flex; gap: 10px; margin-top: 10px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="sma-enabled" checked>

    <div style="display: flex; gap: 10px; margin-top: 5px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="ema-enabled" checked>
            <label for="ema-enabled">EMA</label>
        </div>
        <div class="input-group" style="flex: 1;">
            <label>EMA Period</label>
            <input type="number" id="ema-period" value="10">
        </div>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 5px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="bb-enabled" checked>
            <label for="bb-enabled">Bandas de Bollinger</label>
        </div>
        <div class="input-group" style="flex: 1;">
            <label>BB Period</label>
            <input type="number" id="bb-period" value="20">
        </div>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 5px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="rsi-enabled" checked>
            <label for="rsi-enabled">RSI</label>
        </div>
        <div class="input-group" style="flex: 1;">
            <label>RSI Period</label>
            <input type="number" id="rsi-period" value="7">
        </div>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 5px; align-items: center;">
        <div class="input-group" style="flex: 1;">
            <label>RSI High</label>
            <input type="number" id="rsi-high" value="65">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>RSI Low</label>
            <input type="number" id="rsi-low" value="35">
        </div>

</details>

        <button id="start-btn">CONECTAR WEBSOCKET</button>

        <div id="logs-container">
            <div class="log-entry">Sistema listo. Ingrese parámetros y conecte.</div>
        </div>
    </div>

    <div id="main-content">
        <div id="price-chart">
            <div class="chart-label">JUMP 25 INDEX</div>
        </div>
        <div id="rsi-chart">
            <div class="chart-label">RSI</div>
        </div>
    </div>

    <script type="module">
        // Import indicator functions
        import { calculateSMA, calculateEMA, calculateRSI, calculateBB } from './frontend/js/modules/indicators.js';
        
        // Chart instances and series (declared at module level for accessibility)
        let priceChart, rsiChart;
        let candleSeries, smaSeries, emaSeries, rsiSeries;
        let bbUpperSeries, bbLowerSeries;
        let ws;
        let isConnected = false;
        let currentSymbol = 'R_25';
        let dataHistory = []; // Almacena velas {time, open, high, low, close}
        let lastRsiValue = null; // Para la lógica de pendiente

        const chartOptions = {
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true, visible: true, rightOffset: 50 },
            handleScale: true,
            handleScroll: true
        };
        
        // Always apply right offset to keep space at end of chart
        function applyRightOffset() {
            if (priceChart && dataHistory.length > 0) {
                const lastTime = dataHistory[dataHistory.length - 1].time;
                priceChart.timeScale().setVisibleRange({ from: dataHistory[0].time, to: lastTime + 60 });
            }
        }
        
        function initCharts() {
            const pContainer = document.getElementById('price-chart');
            const rContainer = document.getElementById('rsi-chart');
            
            // Verify library is loaded
            if (typeof LightweightCharts === 'undefined' || !LightweightCharts.createChart) {
                console.error('LightweightCharts library not available');
                addLog('Error: LightweightCharts no disponible', 'put');
                return;
            }
            
            // Clean up existing charts first to avoid conflicts
            if (priceChart) {
                try { priceChart.remove(); } catch(e) {}
                priceChart = null;
            }
            if (rsiChart) {
                try { rsiChart.remove(); } catch(e) {}
                rsiChart = null;
            }
            
            // Limpiar si ya existen para evitar duplicados al reconectar
            pContainer.innerHTML = '<div class="chart-label">JUMP 25 INDEX</div>';
            rContainer.innerHTML = '<div class="chart-label">RSI</div>';

            // Asegurarse de que los contenedores tengan altura
            pContainer.style.minHeight = '300px';
            rContainer.style.minHeight = '150px';

            try {
                priceChart = LightweightCharts.createChart(pContainer, { ...chartOptions, height: pContainer.clientHeight || 300 });
                rsiChart = LightweightCharts.createChart(rContainer, { ...chartOptions, height: rContainer.clientHeight || 150 });
                
                // Verificar que el método existe antes de usarlo
                if (typeof priceChart.addCandlestickSeries === 'function') {
                    candleSeries = priceChart.addCandlestickSeries({
                        upColor: '#089981', downColor: '#f23645',
                        borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645',
                    });
                } else {
                    // Fallback a barras si candlestick no está disponible
                    console.warn('addCandlestickSeries no disponible, usando addBarSeries');
                    candleSeries = priceChart.addBarSeries({
                        upColor: '#089981', downColor: '#f23645',
                        borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645',
                    });
                }
                
                smaSeries = priceChart.addLineSeries({ color: '#2962ff', lineWidth: 2, title: 'SMA' });
                emaSeries = priceChart.addLineSeries({ color: '#f23645', lineWidth: 1, title: 'EMA' });
                bbUpperSeries = priceChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });
                bbLowerSeries = priceChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });

                rsiSeries = rsiChart.addLineSeries({ color: '#ff9800', lineWidth: 2, title: 'RSI' });

                const highLevel = parseFloat(document.getElementById('rsi-high').value) || 65;
                const lowLevel = parseFloat(document.getElementById('rsi-low').value) || 35;
                
                if (!isNaN(highLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: highLevel, 
                        color: '#f23645', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBRECOMPRA' 
                    });
                }
                
                if (!isNaN(lowLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: lowLevel, 
                        color: '#089981', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBREVENTA' 
                    });
                }

                // Sincronización segura de timeScales
                priceChart.timeScale().subscribeVisibleTimeRangeChange(range => {
                    try {
                        if (range && rsiChart) {
                            rsiChart.timeScale().setVisibleRange(range);
                        }
                    } catch (e) {
                        console.warn('Error sincronizando timeScale (precio->rsi):', e);
                    }
                });
                
                rsiChart.timeScale().subscribeVisibleTimeRangeChange(range => {
                    try {
                        if (range && priceChart) {
                            priceChart.timeScale().setVisibleRange(range);
                        }
                    } catch (e) {
                        console.warn('Error sincronizando timeScale (rsi->precio):', e);
                    }
                });
                
                // Ajuste de tamaño al redimensionar ventana
                window.addEventListener('resize', () => {
                    try {
                        if (priceChart && pContainer) {
                            priceChart.resize(pContainer.clientWidth, pContainer.clientHeight || 300);
                        }
                        if (rsiChart && rContainer) {
                            rsiChart.resize(rContainer.clientWidth, rContainer.clientHeight || 150);
                        }
                    } catch (e) {
                        console.warn('Error redimensionando charts:', e);
                    }
                });
            } catch (error) {
                console.error('Error inicializando charts:', error);
                addLog('Error inicializando gráficos: ' + error.message, 'put');
            }
        }

        // --- CÁLCULOS DE INDICADORES (using imported functions) ---

        function updateIndicators() {
            if (dataHistory.length < 2) return;
            
            try {
                const smaP = parseInt(document.getElementById('sma-period').value) || 23;
                const emaP = parseInt(document.getElementById('ema-period').value) || 10;
                const rsiP = parseInt(document.getElementById('rsi-period').value) || 7;
                const bbP = parseInt(document.getElementById('bb-period').value) || 20;

                const smaData = calculateSMA(dataHistory, smaP).filter(d => d.value !== null);
                const emaData = calculateEMA(dataHistory, emaP);
                const rsiData = calculateRSI(dataHistory, rsiP).filter(d => d.value !== null);
                const bb = calculateBB(dataHistory, bbP);

                // Only update series if corresponding checkbox is checked
                if (smaSeries && document.getElementById('sma-enabled').checked) {
                    smaSeries.setData(smaData);
                }
                if (emaSeries && document.getElementById('ema-enabled').checked) {
                    emaSeries.setData(emaData);
                }
                if (rsiSeries && document.getElementById('rsi-enabled').checked) {
                    rsiSeries.setData(rsiData);
                }
                if (bbUpperSeries && document.getElementById('bb-enabled').checked) {
                    bbUpperSeries.setData(bb.upper.filter(d => d.value !== null));
                }
                if (bbLowerSeries && document.getElementById('bb-enabled').checked) {
                    bbLowerSeries.setData(bb.lower.filter(d => d.value !== null));
                }

                // Paso 5: Señales (solo si RSI está habilitado)
                if (rsiData.length >= 2 && document.getElementById('rsi-enabled').checked) {
                    const currentRsi = rsiData[rsiData.length - 1].value;
                    const prevRsi = rsiData[rsiData.length - 2].value;
                    if (currentRsi !== null && prevRsi !== null) {
                        processSignals(currentRsi, prevRsi);
                    }
                }
            } catch (error) {
                console.warn('Error actualizando indicadores:', error);
            }
        }

        // --- WEBSOCKET Y CONEXIÓN ---
        const startBtn = document.getElementById('start-btn');
        startBtn.addEventListener('click', () => isConnected ? location.reload() : connect());
        
        // Checkbox event listeners for enabling/disabling indicators
        document.getElementById('sma-enabled').addEventListener('click', () => {
            const enabled = document.getElementById('sma-enabled').checked;
            if (smaSeries) {
                smaSeries.setVisible(enabled);
                if (enabled) updateIndicators();
            }
        });
        
        document.getElementById('ema-enabled').addEventListener('click', () => {
            const enabled = document.getElementById('ema-enabled').checked;
            if (emaSeries) {
                emaSeries.setVisible(enabled);
                if (enabled) updateIndicators();
            }
        });
        
        document.getElementById('bb-enabled').addEventListener('click', () => {
            const enabled = document.getElementById('bb-enabled').checked;
            if (bbUpperSeries) bbUpperSeries.setVisible(enabled);
            if (bbLowerSeries) bbLowerSeries.setVisible(enabled);
            if (enabled) updateIndicators();
        });
        
        document.getElementById('rsi-enabled').addEventListener('click', () => {
            const enabled = document.getElementById('rsi-enabled').checked;
            if (rsiSeries) {
                rsiSeries.setVisible(enabled);
                if (enabled) updateIndicators();
            }
        });
        
        // Input change listeners for indicator periods
        document.getElementById('sma-period').addEventListener('input', updateIndicators);
        document.getElementById('ema-period').addEventListener('input', updateIndicators);
        document.getElementById('bb-period').addEventListener('input', updateIndicators);
        document.getElementById('rsi-period').addEventListener('input', updateIndicators);
        document.getElementById('rsi-high').addEventListener('input', () => {
            // Update RSI levels when changed
            if (rsiSeries) {
                // Remove existing lines first
                const existingLines = rsiSeries.priceLines();
                existingLines.forEach(line => {
                    try { rsiSeries.removePriceLine(line); } catch(e) {}
                });
                // Add new lines
                const highLevel = parseFloat(document.getElementById('rsi-high').value) || 65;
                const lowLevel = parseFloat(document.getElementById('rsi-low').value) || 35;
                
                if (!isNaN(highLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: highLevel, 
                        color: '#f23645', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBRECOMPRA' 
                    });
                }
                
                if (!isNaN(lowLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: lowLevel, 
                        color: '#089981', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBREVENTA' 
                    });
                }
            }
        });
        document.getElementById('rsi-low').addEventListener('input', () => {
            // Update RSI levels when changed
            if (rsiSeries) {
                // Remove existing lines first
                const existingLines = rsiSeries.priceLines();
                existingLines.forEach(line => {
                    try { rsiSeries.removePriceLine(line); } catch(e) {}
                });
                // Add new lines
                const highLevel = parseFloat(document.getElementById('rsi-high').value) || 65;
                const lowLevel = parseFloat(document.getElementById('rsi-low').value) || 35;
                
                if (!isNaN(highLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: highLevel, 
                        color: '#f23645', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBRECOMPRA' 
                    });
                }
                
                if (!isNaN(lowLevel)) {
                    rsiSeries.createPriceLine({ 
                        price: lowLevel, 
                        color: '#089981', 
                        lineWidth: 1, 
                        lineStyle: 2, 
                        axisLabelVisible: true, 
                        title: 'SOBREVENTA' 
                    });
                }
            }
        });
        
        // Timeframe change: reconnect with new timeframe
        document.getElementById('timeframe').addEventListener('change', () => {
            if (isConnected) {
                addLog('Cambiando temporalidad...');
                if (ws) {
                    ws.close();
                }
                // Reconnect after a short delay
                setTimeout(() => connect(), 500);
            }
        });

        function connect() {
            const appId = document.getElementById('app-id').value || '1089';
            const token = document.getElementById('api-token').value;
            const granularity = parseInt(document.getElementById('timeframe').value) || 60;

            addLog(`Conectando a Deriv (App ID: ${appId})...`);

            ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${appId}`);

            ws.onopen = () => {
                addLog('Conectado a Deriv. Solicitando historial (1 hora)...');
                initCharts();
                if (token) {
                    ws.send(JSON.stringify({ authorize: token }));
                } else {
                    requestHistory();
                }
            };

            ws.onmessage = (msg) => {
                try {
                    const res = JSON.parse(msg.data);
                    // Debug: Log all incoming messages
                    console.log('WebSocket message received:', res);
                    
                    if (res.msg_type === 'authorize') {
                        if (res.error) {
                            addLog('Error de Token: ' + res.error.message, 'put');
                        } else {
                            addLog('Autorizado.');
                            requestHistory();
                        }
                    }
                    // Handle explicit error messages from API
                    if (res.msg_type === 'error') {
                        addLog('Error de API: ' + (res.error?.message || JSON.stringify(res)), 'put');
                    }

                    // Manejo de Historial de Velas
                    if (res.msg_type === 'candles' && res.candles && Array.isArray(res.candles)) {
                        const validCandles = res.candles
                            .map(c => ({
                                time: parseInt(c.epoch),
                                open: parseFloat(c.open),
                                high: parseFloat(c.high),
                                low: parseFloat(c.low),
                                close: parseFloat(c.close)
                            }))
                            .filter(c => 
                                !isNaN(c.time) && !isNaN(c.open) && !isNaN(c.high) && 
                                !isNaN(c.low) && !isNaN(c.close) &&
                                c.open > 0 && c.high > 0 && c.low > 0 && c.close > 0 &&
                                c.high >= Math.max(c.open, c.close) && 
                                c.low <= Math.min(c.open, c.close)
                            );

                        if (validCandles.length > 0) {
                            dataHistory = validCandles;
                            if (candleSeries) candleSeries.setData(dataHistory);
                            updateIndicators(); // Calcular indicadores iniciales
                            subscribeOHLC();
                            isConnected = true;
                            startBtn.innerText = 'DESCONECTAR';
                            addLog(`Historial cargado: ${dataHistory.length} velas válidas`);
                            // Auto-scroll to latest candle
                            setTimeout(scrollToLatest, 100);
                        } else {
                            addLog('No se recibieron velas válidas del historial', 'put');
                        }
                    }

                    // Manejo de Velas en Tiempo Real (msg_type: ohlc)
                    if (res.msg_type === 'ohlc' && res.ohlc) {
                        const o = res.ohlc;
                        const candle = {
                            time: parseInt(o.open_time),
                            open: parseFloat(o.open),
                            high: parseFloat(o.high),
                            low: parseFloat(o.low),
                            close: parseFloat(o.close)
                        };

                        // Validar que todos los valores sean números válidos
                        if (!isNaN(candle.time) && !isNaN(candle.open) && !isNaN(candle.high) && 
                            !isNaN(candle.low) && !isNaN(candle.close) &&
                            candle.open > 0 && candle.high > 0 && candle.low > 0 && candle.close > 0 &&
                            candle.high >= Math.max(candle.open, candle.close) && 
                            candle.low <= Math.min(candle.open, candle.close)) {
                            
                            if (candleSeries) candleSeries.update(candle);

                            // Actualizar nuestro array de datos
                            if (dataHistory.length > 0 && dataHistory[dataHistory.length - 1].time === candle.time)  {
                                dataHistory[dataHistory.length - 1] = candle; // Actualiza vela actual
                            } else {
                                dataHistory.push(candle);
                                if (dataHistory.length > 5000) dataHistory.shift(); // Limitar memoria
                            }
                            updateIndicators();
                        }
                    }
                } catch (e) {
                    console.error('Error procesando mensaje WS:', e);
                    addLog('Error procesando mensaje: ' + e.message, 'put');
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                addLog('Error de WebSocket: ' + error.message, 'put');
            };

            ws.onclose = () => {
                addLog('Conexión cerrada.', 'put');
                isConnected = false;
                startBtn.innerText = 'CONECTAR WEBSOCKET';
            };
        }

        function requestHistory() {
            const gran = parseInt(document.getElementById('timeframe').value) || 60;
            const now = Math.floor(Date.now() / 1000);
            const oneHourAgo = now - 3600; // 1 hora en segundos
            
            // For history request, we DON'T want to subscribe - just get data once
            const request = {
                ticks_history: currentSymbol,
                end: 'latest',
                start: oneHourAgo,
                style: 'candles',
                granularity: gran
                // Note: NOT including subscribe field at all for one-time request
            };
            
            addLog(`Enviando solicitud de historial (no suscripción): ${JSON.stringify(request)}`);
            ws.send(JSON.stringify(request));
        }

        function subscribeOHLC() {
            const gran = parseInt(document.getElementById('timeframe').value) || 60;
            try {
                const subscribeRequest = {
                    ticks_history: currentSymbol,
                    subscribe: 1, // Suscribirse a updates
                    end: 'latest',
                    granularity: gran,
                    style: 'candles'
                };
                addLog(`Enviando solicitud de suscripción: ${JSON.stringify(subscribeRequest)}`);
                ws.send(JSON.stringify({ forget_all: 'ohlc' })); // Olvidar suscripciones previas
                ws.send(JSON.stringify(subscribeRequest));
            } catch (e) {
                console.error('Error suscribiendo a OHLC:', e);
                addLog('Error suscribiendo a actualizaciones: ' + e.message, 'put');
            }
        }

        // --- ESTRATEGIA DE SEÑALES ---
        function processSignals(currentRsi, prevRsi) {
            const rsiHigh = parseFloat(document.getElementById('rsi-high').value) || 65;
            const rsiLow = parseFloat(document.getElementById('rsi-low').value) || 35;
            let signal = null; // 'call' or 'put'
            let trend = '';

            if (currentRsi > rsiHigh && currentRsi > prevRsi) {
                signal = 'call';
                trend = 'Subiendo (RSI > ' + rsiHigh + ')';
            } else if (currentRsi < rsiLow && currentRsi < prevRsi) {
                signal = 'put';
                trend = 'Bajando (RSI < ' + rsiLow + ')';
            }

            const logMsg = `RSI: ${currentRsi.toFixed(2)} | Prev: ${prevRsi.toFixed(2)} | Trend: ${trend}`;
            addLog(logMsg);
            
            // Dibujar marcador (flecha) en el gráfico - preserving existing markers
            if (signal && candleSeries && dataHistory && dataHistory.length > 0) {
                const lastCandle = dataHistory[dataHistory.length - 1];
                const markerColor = signal === 'call' ? '#089981' : '#f23645'; // Verde para Call, Rojo para Put
                const markerShape = signal === 'call' ? 'arrowUp' : 'arrowDown';
                const markerText = signal === 'call' ? 'CALL' : 'PUT';
                
                // Get existing markers and add new one
                const existingMarkers = candleSeries.markers() || [];
                const newMarker = {
                    time: lastCandle.time,
                    position: 'aboveBar',
                    color: markerColor,
                    shape: markerShape,
                    text: markerText + ' @ ' + lastCandle.close.toFixed(2)
                };
                candleSeries.setMarkers([...existingMarkers, newMarker]);
                addLog(`¡SEÑAL DE ${signal.toUpperCase()} DETECTADA!`, signal);
            }
        }

        // Inicialización inicial al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof LightweightCharts === 'undefined') {
                console.error('LightweightCharts library not loaded');
                addLog('Error: LightweightCharts no cargado', 'put');
                return;
            }
            initCharts();
            window.dispatchEvent(new Event('resize'));
        });
        
        // Keyboard navigation for charts
        document.addEventListener('keydown', (e) => {
            if (!priceChart || !rsiChart) return;
            
            const timeScale = priceChart.timeScale();
            const visibleRange = timeScale.getVisibleRange();
            if (!visibleRange) return;
            
            const totalBars = dataHistory.length;
            const scrollAmount = Math.floor(totalBars * 0.3); // 30% of data at a time
            
            switch(e.key) {
                case 'End': // Go to latest candle with full zoom
                    e.preventDefault();
                    if (dataHistory.length > 0) {
                        const lastTime = dataHistory[dataHistory.length - 1].time;
                        const firstTime = dataHistory[0].time;
                        timeScale.setVisibleRange({ from: firstTime, to: lastTime + 60 });
                        // Auto-fit price scale
                        priceChart.timeScale().fitContent();
                        rsiChart.timeScale().fitContent();
                    }
                    break;
                case 'Home': // Reset view - zoom to latest with auto price scale
                    e.preventDefault();
                    if (dataHistory.length > 0) {
                        const lastTime = dataHistory[dataHistory.length - 1].time;
                        const firstTime = dataHistory[Math.max(0, dataHistory.length - 50)].time;
                        // Show last 50 candles on screen
                        timeScale.setVisibleRange({ from: firstTime, to: lastTime + 30 });
                        // Auto-fit price scale to visible data
                        priceChart.timeScale().fitContent();
                        rsiChart.timeScale().fitContent();
                    }
                    break;
                case 'PageDown': // Scroll right (older)
                    e.preventDefault();
                    timeScale.setVisibleRange({
                        from: visibleRange.from + scrollAmount,
                        to: visibleRange.to + scrollAmount
                    });
                    break;
                case 'PageUp': // Scroll left (newer)
                    e.preventDefault();
                    timeScale.setVisibleRange({
                        from: visibleRange.from - scrollAmount,
                        to: visibleRange.to - scrollAmount
                    });
                    break;
            }
        });
        
        // Function to scroll to latest candle
        function scrollToLatest() {
            if (!priceChart || dataHistory.length === 0) return;
            
            const lastTime = dataHistory[dataHistory.length - 1].time;
            const firstTime = dataHistory[0].time;
            priceChart.timeScale().setVisibleRange({ from: firstTime, to: lastTime + 60 });
            // Auto-fit price scale to visible data
            priceChart.timeScale().fitContent();
            rsiChart.timeScale().fitContent();
        }
        
        // Keep right offset always applied
        setInterval(() => {
            if (isConnected && dataHistory.length > 0 && priceChart) {
                const lastTime = dataHistory[dataHistory.length - 1].time;
                const currentRange = priceChart.timeScale().getVisibleRange();
                if (currentRange && currentRange.to >= lastTime) {
                    // Already at latest, ensure right offset
                    priceChart.timeScale().setVisibleRange({ from: currentRange.from, to: lastTime + 60 });
                }
            }
        }, 1000);

        // Función para agregar logs
        function addLog(message, type = 'call') {
            const logsContainer = document.getElementById('logs-container');
            if (!logsContainer) return;
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> ${message}`;
            logsContainer.appendChild(logEntry);
            
            // Mantener solo los últimos 100 logs
            while (logsContainer.children.length > 100) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
            
            // Scroll automático al final
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }
    </script>
</body>
</html>
