 <!DOCTYPE html>
 <html lang="es">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Jump 25 Trading Bot - Deriv</title>
     <!-- Librería Lightweight Charts -->
     <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
     <style>
         :root {
             --bg-color: #131722;
             --sidebar-bg: #1e222d;
             --border-color: #2a2e39;
             --text-color: #d1d4dc;
             --accent-color: #2962ff;
             --success: #089981;
             --danger: #f23645;
         }

         body {
             margin: 0;
             padding: 0;
             background-color: var(--bg-color);
             color: var(--text-color);
             font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
             display: flex;
             height: 100vh;
             overflow: hidden;
         }

         /* Sidebar Styles */
         #sidebar {
             width: 320px;
             background-color: var(--sidebar-bg);
             border-right: 1px solid var(--border-color);
             display: flex;
             flex-direction: column;
             padding: 20px;
             box-sizing: border-box;
             z-index: 10;
             overflow-y: auto; /* Permite scroll si el contenido es largo */
         }

         h2 { font-size: 1.2rem; margin-top: 0; color: #fff; }

         .input-group { margin-bottom: 15px; }
         label { display: block; font-size: 11px; color: #b2b5be; text-transform: uppercase; margin-bottom: 5px; }
         
         input, select {
             width: 100%;
             background-color: #2a2e39;
             border: 1px solid #363c4e;
             color: #d1d4dc;
             padding: 10px;
             border-radius: 4px;
             box-sizing: border-box;
             outline: none;
             font-size: 14px;
         }

         input:focus, select:focus { border-color: var(--accent-color); }

         button {
             width: 100%;
             background-color: var(--accent-color);
             color: white;
             border: none;
             padding: 12px;
             border-radius: 4px;
             cursor: pointer;
             font-weight: bold;
             margin-top: 10px;
             transition: opacity 0.2s;
         }

         button:hover { opacity: 0.9; }

         /* Logs Viewer */
         #logs-container {
             flex-grow: 1;
             margin-top: 20px;
             background-color: #000;
             border: 1px solid var(--border-color);
             border-radius: 4px;
             padding: 10px;
             font-family: 'Consolas', 'Monaco', monospace;
             font-size: 12px;
             overflow-y: auto;
             color: #4ade80; /* Green terminal color */
             max-height: 200px; /* Limita la altura del contenedor de logs */
         }

         .log-entry { margin-bottom: 6px; border-bottom: 1px solid #111; padding-bottom: 4px; line-height: 1.4; word-break: break-word; }
         .log-time { color: #888; font-size: 10px; }
         .signal-call { color: var(--success); font-weight: bold; }
         .signal-put { color: var(--danger); font-weight: bold; }

         /* Main Content / Charts */
         #main-content {
             flex-grow: 1;
             display: flex;
             flex-direction: column;
             position: relative;
             overflow: hidden; /* Evita que los charts se desborden */
         }

         #price-chart { flex: 2; position: relative; min-height: 300px; } /* Altura mínima para asegurar visibilidad */
         #rsi-chart { flex: 1; border-top: 2px solid var(--border-color); position: relative; min-height: 150px; } /* Altura mínima */

         .chart-label {
             position: absolute;
             top: 10px;
             left: 10px;
             z-index: 5;
             background: rgba(30, 34, 45, 0.8);
             padding: 4px 8px;
             border-radius: 3px;
             font-size: 12px;
             pointer-events: none;
         }
     </style>
 </head>
 <body>
     <div id="sidebar">
         <h2>Deriv Jump 25 Bot</h2>
         
         <div class="input-group">
             <label for="api-token">API Token (Opcional)</label>
             <input type="password" id="api-token" placeholder="Tu token de Deriv...">
         </div>

         <div class="input-group">
             <label for="app-id">App ID</label>
             <input type="text" id="app-id" value="1089" placeholder="Ej: 1089">
         </div>

         <div class="input-group">
             <label for="timeframe">Temporalidad (Velas)</label>
             <select id="timeframe">
                 <option value="1">1 Segundo</option>
                 <option value="5">5 Segundos</option>
                 <option value="15">15 Segundos</option>
                 <option value="60" selected>1 Minuto</option>
                 <option value="300">5 Minutos</option>
                 <option value="900">15 Minutos</option>
             </select>
         </div>

         <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
             <label style="color: var(--accent-color); font-weight: bold;">Indicadores</label>
             <div style="display: flex; gap: 10px; margin-top: 10px;">
                 <div class="input-group" style="flex: 1;">
                     <label>SMA Period</label>
                     <input type="number" id="sma-period" value="23">
                 </div>
                 <div class="input-group" style="flex: 1;">
                     <label>EMA Period</label>
                     <input type="number" id="ema-period" value="10">
                 </div>
             </div>
             <div style="display: flex; gap: 10px;">
                 <div class="input-group" style="flex: 1;">
                     <label>RSI Period</label>
                     <input type="number" id="rsi-period" value="7">
                 </div>
                 <div class="input-group" style="flex: 1;">
                     <label>BB Period</label>
                     <input type="number" id="bb-period" value="20">
                 </div>
             </div>
             <div style="display: flex; gap: 10px;">
                 <div class="input-group" style="flex: 1;">
                     <label>RSI High</label>
                     <input type="number" id="rsi-high" value="65">
                 </div>
                 <div class="input-group" style="flex: 1;">
                     <label>RSI Low</label>
                     <input type="number" id="rsi-low" value="35">
                 </div>
             </div>
         </div>

         <button id="start-btn">CONECTAR WEBSOCKET</button>

         <div id="logs-container">
             <div class="log-entry">Sistema listo. Ingrese parámetros y conecte.</div>
         </div>
     </div>

     <div id="main-content">
         <div id="price-chart">
             <div class="chart-label">JUMP 25 INDEX</div>
         </div>
         <div id="rsi-chart">
             <div class="chart-label">RSI</div>
         </div>
     </div>

     <script>
         let priceChart, rsiChart;
         let candleSeries, smaSeries, emaSeries, rsiSeries;
         let bbUpperSeries, bbLowerSeries;
         let ws;
         let isConnected = false;
         let currentSymbol = 'R_25';
         let dataHistory = []; // Almacena velas {time, open, high, low, close}
         let lastRsiValue = null; // Para la lógica de pendiente

         const chartOptions = {
             layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
             grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
             crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
             rightPriceScale: { borderColor: '#2a2e39' },
             timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: true },
         };

         function initCharts() {
             const pContainer = document.getElementById('price-chart');
             const rContainer = document.getElementById('rsi-chart');
             // Limpiar si ya existen para evitar duplicados al reconectar
             pContainer.innerHTML = '<div class="chart-label">JUMP 25 INDEX</div>';
             rContainer.innerHTML = '<div class="chart-label">RSI</div>';

             priceChart = LightweightCharts.createChart(pContainer, { ...chartOptions, height: pContainer.clientHeight });
             candleSeries = priceChart.addCandlestickSeries({
                 upColor: '#089981', downColor: '#f23645',
                 borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645',
             });
             
             smaSeries = priceChart.addLineSeries({ color: '#2962ff', lineWidth: 2, title: 'SMA' });
             emaSeries = priceChart.addLineSeries({ color: '#f23645', lineWidth: 1, title: 'EMA' });
             bbUpperSeries = priceChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });
             bbLowerSeries = priceChart.addLineSeries({ color: 'rgba(255, 255, 255, 0.2)', lineWidth: 1, lineStyle: 2 });

             rsiChart = LightweightCharts.createChart(rContainer, { ...chartOptions, height: rContainer.clientHeight });
             rsiSeries = rsiChart.addLineSeries({ color: '#ff9800', lineWidth: 2, title: 'RSI' });

             const highLevel = parseFloat(document.getElementById('rsi-high').value);
             const lowLevel = parseFloat(document.getElementById('rsi-low').value);
             rsiSeries.createPriceLine({ price: highLevel, color: '#f23645', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'SOBRECOMPRA' });
             rsiSeries.createPriceLine({ price: lowLevel, color: '#089981', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: 'SOBREVENTA' });

             priceChart.timeScale().subscribeVisibleTimeRangeChange(range => rsiChart.timeScale().setVisibleRange(range));
             rsiChart.timeScale().subscribeVisibleTimeRangeChange(range => priceChart.timeScale().setVisibleRange(range));
             
             // Ajuste de tamaño al redimensionar ventana
             window.addEventListener('resize', () => {
                 priceChart.resize(pContainer.clientWidth, pContainer.clientHeight);
                 rsiChart.resize(rContainer.clientWidth, rContainer.clientHeight);
             });
         }

         // --- CÁLCULOS DE INDICADORES ---
         function calculateSMA(data, period) {
             return data.map((d, i) => {
                 if (i < period - 1) return { time: d.time, value: null };
                 let sum = 0;
                 for (let j = 0; j < period; j++) sum += data[i - j].close;
                 return { time: d.time, value: sum / period };
             });
         }

         function calculateEMA(data, period) {
             if (data.length === 0) return [];
             let k = 2 / (period + 1);
             let ema = data[0].close;
             return data.map(d => {
                 ema = (d.close - ema) * k + ema;
                 return { time: d.time, value: ema };
             });
         }

         function calculateRSI(data, period) {
             let res = [];
             if(data.length < period + 1) return data.map(d => ({time: d.time, value: null}));
             
             for (let i = 0; i < data.length; i++) {
                 if (i < period) { res.push({ time: data[i].time, value: null }); continue; }
                 let gains = 0, losses = 0;
                 for (let j = i - period + 1; j <= i; j++) {
                     let diff = data[j].close - data[j - 1].close;
                     diff >= 0 ? gains += diff : losses -= diff;
                 }
                 let rs = gains / (losses || 1);
                 res.push({ time: data[i].time, value: 100 - (100 / (1 + rs)) });
             }
             return res;
         }

         function calculateBB(data, period) {
             let upper = [], lower = [];
             data.forEach((d, i) => {
                 if (i < period - 1) { upper.push({ time: d.time, value: null }); lower.push({ time: d.time, value: null }); return; }
                 let sum = 0;
                 for (let j = 0; j < period; j++) sum += data[i - j].close;
                 let avg = sum / period;
                 let sqSum = 0;
                 for (let j = 0; j < period; j++) sqSum += Math.pow(data[i - j].close - avg, 2);
                 let sd = Math.sqrt(sqSum / period);
                 upper.push({ time: d.time, value: avg + sd * 2 });
                 lower.push({ time: d.time, value: avg - sd * 2 });
             });
             return { upper, lower };
         }

         function updateIndicators() {
             if (dataHistory.length < 2) return;
             
             const smaP = parseInt(document.getElementById('sma-period').value);
             const emaP = parseInt(document.getElementById('ema-period').value);
             const rsiP = parseInt(document.getElementById('rsi-period').value);
             const bbP = parseInt(document.getElementById('bb-period').value);

             smaSeries.setData(calculateSMA(dataHistory, smaP).filter(d => d.value !== null));
             emaSeries.setData(calculateEMA(dataHistory, emaP));
             const rsiData = calculateRSI(dataHistory, rsiP);
             rsiSeries.setData(rsiData.filter(d => d.value !== null));
             const bb = calculateBB(dataHistory, bbP);
             bbUpperSeries.setData(bb.upper.filter(d => d.value !== null));
             bbLowerSeries.setData(bb.lower.filter(d => d.value !== null));

             // Paso 5: Señales
             if (rsiData.length >= 2) {
                 const currentRsi = rsiData[rsiData.length - 1].value;
                 const prevRsi = rsiData[rsiData.length - 2].value;
                 if (currentRsi !== null && prevRsi !== null) {
                     processSignals(currentRsi, prevRsi);
                 }
             }
         }

         // --- WEBSOCKET Y CONEXIÓN ---
         const startBtn = document.getElementById('start-btn');
         startBtn.addEventListener('click', () => isConnected ? location.reload() : connect());

         function connect() {
             const appId = document.getElementById('app-id').value || '1089';
             const token = document.getElementById('api-token').value;
             const granularity = parseInt(document.getElementById('timeframe').value);

             ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${appId}`);

             ws.onopen = () => {
                 addLog('Conectado a Deriv. Solicitando historial (1 hora)...');
                 initCharts();
                 if (token) ws.send(JSON.stringify({ authorize: token })); else requestHistory();
             };

             ws.onmessage = (msg) => {
                 const res = JSON.parse(msg.data);
                 
                 if (res.msg_type === 'authorize') {
                     if (res.error) addLog('Error de Token: ' + res.error.message, 'put');
                     else { addLog('Autorizado.'); requestHistory(); }
                 }

                 // Manejo de Historial de Velas
                 if (res.msg_type === 'candles') {
                     dataHistory = res.candles.map(c => ({ time: c.epoch, open: c.open, high: c.high, low: c.low, close: c.close }));
                     candleSeries.setData(dataHistory);
                     updateIndicators(); // Calcular indicadores iniciales
                     subscribeOHLC();
                     isConnected = true;
                     startBtn.innerText = 'DESCONECTAR';
                 }

                 // Manejo de Velas en Tiempo Real (msg_type: ohlc)
                 if (res.msg_type === 'ohlc') {
                     const o = res.ohlc;
                     const candle = { time: o.open_time, open: parseFloat(o.open), high: parseFloat(o.high), low: parseFloat(o.low), close: parseFloat(o.close) };
                     candleSeries.update(candle);

                     // Actualizar nuestro array de datos
                     if (dataHistory.length > 0 && dataHistory[dataHistory.length - 1].time === candle.time)  {
                         dataHistory[dataHistory.length - 1] = candle; // Actualiza vela actual
                     } else {
                         dataHistory.push(candle);
                         if (dataHistory.length > 5000) dataHistory.shift(); // Limitar memoria
                     }
                     updateIndicators();
                 }
             };

             ws.onclose = () => {
                 addLog('Conexión cerrada.', 'put');
                 isConnected = false;
                 startBtn.innerText = 'CONECTAR WEBSOCKET';
             };
         }

         function requestHistory() {
             const gran = parseInt(document.getElementById('timeframe').value);
             const now = Math.floor(Date.now() / 1000);
             const oneHourAgo = now - 3600; // 1 hora en segundos
             
             ws.send(JSON.stringify({
                 ticks_history: currentSymbol,
                 end: 'latest',
                 start: oneHourAgo,
                 style: 'candles',
                 granularity: gran,
                 subscribe: 0 // Solo historial primero
             }));
         }

         function subscribeOHLC() {
             const gran = parseInt(document.getElementById('timeframe').value);
             ws.send(JSON.stringify({ forget_all: 'ohlc' })); // Olvidar suscripciones previas
             ws.send(JSON.stringify({
                 ticks_history: currentSymbol,
                 subscribe: 1, // Suscribirse a updates
                 end: 'latest',
                 granularity: gran,
                 style: 'candles'
             }));
         }

         // --- ESTRATEGIA DE SEÑALES ---
         function processSignals(currentRsi, prevRsi) {
             const rsiHigh = parseFloat(document.getElementById('rsi-high').value);
             const rsiLow = parseFloat(document.getElementById('rsi-low').value);
             let signal = null; // 'call' or 'put'
             let trend = '';

             if (currentRsi > rsiHigh && currentRsi > prevRsi) {
                 signal = 'call';
                 trend = 'Subiendo (RSI > 65)';
             } else if (currentRsi < rsiLow && currentRsi < prevRsi) {
                 signal = 'put';
                 trend = 'Bajando (RSI < 35)';
             }

             const logMsg = `RSI: ${currentRsi.toFixed(2)} | Prev: ${prevRsi.toFixed(2)} | Trend: ${trend}`;
             addLog(logMsg);
             
             // Dibujar marcador en el gráfico
             if (signal) {
                 const lastCandle = dataHistory[dataHistory.length - 1];
                 const markerColor = signal === 'call' ? '#089981' : '#f23645'; // Verde para Call, Rojo para Put
                 const markerText = signal === 'call' ? '▲' : '▼';

                 candleSeries.createPriceLine({
                     price: lastCandle.high, // Posicionar sobre el máximo de la vela
                     color: markerColor,
                     lineWidth: 2,
                     lineStyle: LightweightCharts.LineStyle.Solid,
                     axisLabelVisible: false, // No mostrar label de precio
                     visible: true,
                     title: markerText // Usar texto como marcador simple
                 });
                 addLog(`¡SEÑAL DE ${signal.toUpperCase()} DETECTADA!`, signal);
             }
         }

         // Inicialización inicial al cargar la página
         window.onload = () => {
             initCharts();
             // Ajustar tamaño inicial si es necesario
             window.dispatchEvent(new Event('resize'));
         };
     </script>
 </body>
 </html>
